<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мобильный сервис для писателей и редакторов</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Import Map for Firebase SDKs (allows usage of 'firebase/app' imports without bundler) -->
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
        "firebase/analytics": "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js"
      }
    }
    </script>
</head>

<body>

    <!-- Landing Page (Session Start) -->
    <div id="landingPage" class="landing-container">
        <div class="landing-content">
            <span class="landing-icon">📝</span>
            <h1>Мобильный Редактор</h1>
            <p>Создайте новый документ и поделитесь ссылкой для совместной работы.</p>
            <button id="startSessionBtn" class="primary-btn large-btn">Начать работу 🚀</button>
        </div>
    </div>

    <!-- Main App Container (Hidden by default until session active) -->
    <div id="appContainer" class="hidden">
        <div id="menuOverlay" class="menu-overlay"></div>
        <div class="app-screen">
            <!-- Sidebar / Burger Menu -->
            <div id="sideMenu" class="side-menu hidden">
                <div class="side-menu-header">
                    <h3>Меню</h3>
                    <button id="closeMenuBtn" class="icon-btn">✕</button>
                </div>
                <div class="side-menu-content">
                    <button id="downloadBtn" class="menu-item-btn">
                        <span class="icon">📥</span> Скачать txt
                    </button>
                    <button id="shareBtn" class="menu-item-btn">
                        <span class="icon">🔗</span> Поделиться
                    </button>
                    <button id="historyBtn" class="menu-item-btn">
                        <span class="icon">↺</span> История версий
                    </button>
                    <div class="separator"></div>
                    <div class="menu-section-title">Пользователь</div>
                    <div class="user-avatar-container" id="userSwitcherBtn">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="User" class="user-avatar" id="currentUserAvatar">
                        <div class="user-info">
                            <span class="user-name">Я (Автор)</span>
                            <span class="user-badge" id="currentUserId">ID: 1</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Top Bar: Title & Burger Toggle -->
            <header class="app-header">
                <div class="header-left">
                    <button id="burgerBtn" class="icon-btn" style="font-size: 24px;">☰</button>
                    <input type="text" class="doc-title-input" value="Новый документ" id="docTitleInput">
                </div>
                <div class="header-right">
                    <div id="expirationBadge" class="expiration-badge" title="До авто-удаления">7 дн.</div>
                </div>
            </header>

        <!-- Formatting Toolbar (Sticky) -->
        <div class="toolbar" id="toolbar">
            <div class="toolbar-scroll">
                <button data-cmd="bold" class="tool-btn" title="Жирный"><b>B</b></button>
                <button data-cmd="italic" class="tool-btn" title="Курсив"><i>I</i></button>
                <button data-cmd="underline" class="tool-btn" title="Подчеркнутый"><u>U</u></button>
                <div class="separator"></div>
                <button data-cmd="formatBlock" data-val="H1" class="tool-btn">H1</button>
                <button data-cmd="formatBlock" data-val="H2" class="tool-btn">H2</button>
                <button data-cmd="formatBlock" data-val="H3" class="tool-btn">H3</button>
            </div>
        </div>

            <!-- Main Editor Area -->
            <main class="content-area">
                <div id="editor" class="editor" contenteditable="true" spellcheck="false">
                    <p>Начните печатать здесь...</p>
                </div>
            </main>
        </div>
    </div>

    <!-- Floating "Add Comment" Button (appears on selection) -->
    <button id="addCommentBtn" class="floating-action-btn hidden">
        <span>+ Комментарий</span>
    </button>

    <!-- Bottom Sheet / Overlay for Comments -->
    <div id="commentOverlay" class="overlay hidden">
        <div class="bottom-sheet">
            <div class="sheet-header">
                <h3>Комментарии</h3>
                <button id="closeCommentsBtn" class="close-btn">✕</button>
            </div>
            <div id="commentsList" class="comments-list">
                <!-- Comments will be injected here -->
            </div>
            <div id="newCommentInputArea" class="new-comment-area hidden">
                <textarea id="newCommentText" placeholder="Напишите комментарий..."></textarea>
                <button id="submitCommentBtn" class="primary-btn">Отправить</button>
            </div>
        </div>
    </div>

    <!-- User Switcher Modal -->
    <div id="userModal" class="modal hidden">
        <div class="modal-content">
            <h3>Выберите пользователя</h3>
            <div class="user-option" data-user-id="1" data-name="Я (Автор)" data-color="#E8F0FE">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" class="user-avatar">
                <span>Я (Автор)</span>
            </div>
            <div class="user-option" data-user-id="2" data-name="Коллега (Редактор)" data-color="#FEF7E0">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Aneka" class="user-avatar">
                <span>Коллега (Редактор)</span>
            </div>
            <button class="close-modal-btn">Закрыть</button>
        </div>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal hidden">
        <div class="modal-content full-height">
            <div class="modal-header">
                <h3>История изменений</h3>
                <button class="close-modal-btn">✕</button>
            </div>
            <div id="historyList" class="history-list">
                <!-- History items -->
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
